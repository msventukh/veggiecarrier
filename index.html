<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Trivia Board</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <section id="screen-start" class="screen active">
    <h1>Trivia Board</h1>
    <p class="subtitle">1. Choose the number of players</p>
    <div id="count-buttons" class="count-buttons">
      <button class="count-btn" data-count="2">2</button>
      <button class="count-btn" data-count="3">3</button>
      <button class="count-btn" data-count="4">4</button>
    </div>
    <div id="player-name-inputs" class="player-name-inputs"></div>
    <!-- Step 2, shown once a player count is picked. -->
    <div id="mode-section" class="mode-section hidden">
      <p class="subtitle">2. Choose when the game ends</p>
      <div id="mode-buttons" class="mode-buttons">
        <button class="mode-btn selected" data-mode="questions">Questions</button>
        <button class="mode-btn" data-mode="score">Score</button>
      </div>
      <div id="question-count-row" class="mode-setting">
        <label for="question-count-input">Questions to play</label>
        <input id="question-count-input" type="number" min="1" max="64" step="1" value="64">
      </div>
      <div id="target-score-row" class="mode-setting hidden">
        <label for="target-score-input">Points to win</label>
        <input id="target-score-input" type="number" min="100" step="100">
      </div>
    </div>
    <button id="start-game-btn" class="primary-btn" disabled>Start Game</button>
  </section>

  <section id="screen-board" class="screen">
    <p id="game-goal" class="subtitle game-goal"></p>
    <div id="scoreboard" class="scoreboard"></div>
    <table id="board-table" class="board-table"></table>
  </section>

  <section id="screen-gameover" class="screen">
    <h1>Game Over</h1>
    <p id="gameover-reason" class="subtitle"></p>
    <ol id="final-scores" class="final-scores"></ol>
    <button id="new-game-btn" class="primary-btn">New Game</button>
  </section>

</div>

<div id="question-overlay" class="overlay hidden">
  <div class="overlay-panel">
    <div class="overlay-header">
      <span id="overlay-category"></span> &mdash; <span id="overlay-value"></span>
    </div>
    <div id="overlay-content" class="overlay-content">
      <div id="video-box" class="video-box hidden">
        <div id="video-host" class="video-host"></div>
        <div id="video-cover" class="video-cover"></div>
      </div>
      <div id="audio-status" class="audio-status"></div>
      <div id="audio-controls" class="audio-controls">
        <button id="audio-toggle-btn" class="secondary-btn"></button>
        <button id="audio-replay-btn" class="secondary-btn">Replay from start</button>
      </div>
    </div>
    <button id="reveal-answer-btn" class="secondary-btn">Reveal Answer</button>
    <div id="overlay-answer" class="overlay-answer hidden"></div>
    <div id="overlay-players" class="overlay-players"></div>
    <button id="cancel-question-btn" class="secondary-btn">Cancel</button>
  </div>
</div>

<script src="questions/questions.max-favs.js"></script>
<script src="app.js"></script>
</body>
</html>
